name: Check phone CPU candidate - no guest boot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact candidate without changing production defaults
        run: python3 tools/local-restore/phone_cpu_candidate.py "$PWD"
      - name: Check shared iPhone and Mac sources
        run: |
          echo 'enum BuildInfo { static let stamp = "phone CPU candidate" }' > /tmp/InfernoBuildInfo.swift
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios16.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -parse-as-library /tmp/InfernoBuildInfo.swift app/Sources/*.swift
          xcrun --sdk macosx swiftc -typecheck -target arm64-apple-macos15.0 -sdk "$(xcrun --sdk macosx --show-sdk-path)" -parse-as-library /tmp/InfernoBuildInfo.swift app/Sources/*.swift
      - name: Save reviewed source delta
        run: |
          mkdir candidate-output
          git diff -- app/Sources/Settings.swift > candidate-output/phone-cpu.patch
          shasum -a 256 app/Sources/Settings.swift > candidate-output/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: phone-cpu-candidate
          path: candidate-output/
