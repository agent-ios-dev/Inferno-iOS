name: Build Inferno.ipa

# Builds an unsigned Inferno.ipa on a GitHub runner, so nobody needs their own
# Mac. The .ipa is attached to the run as an artifact.
#
# Only by hand, from the Actions tab: a run costs the better part of half an
# hour of macOS runner time, and the release builds are made on a Mac and
# uploaded from there, not here.
#
# No guest image, firmware or Apple key is involved here — those are still
# yours to build by ChefKiss's guide (see README).

on:
  workflow_dispatch:
    inputs:
      emulator_ref:
        description: "Pinned commit of agent-ios-dev/Inferno with restore boot handoff"
        default: "37d68169800a2e41de7da7e96478a15ac4431ca7"

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      EMULATOR_REF: ${{ github.event.inputs.emulator_ref || '37d68169800a2e41de7da7e96478a15ac4431ca7' }}
      PREFIX: ${{ github.workspace }}/prefix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build tools
        run: |
          # ldid подписывает помощника для гостя (nsio) с правами на блочные
          # устройства; без него build.sh соберёт приложение без быстрого канала.
          brew install --quiet meson ninja cmake pkg-config autoconf automake libtool m4 qemu ldid
          echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"

      - name: Environment fingerprint (cache key)
        id: env
        run: |
          echo "xcode=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "deps=${{ hashFiles('scripts/build-ios-deps.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies (prefix)
        id: cache-prefix
        uses: actions/cache/restore@v4
        with:
          path: prefix
          key: iosdeps-${{ runner.os }}-${{ steps.env.outputs.xcode }}-${{ steps.env.outputs.deps }}

      - name: Build iOS dependencies
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: PREFIX="$PREFIX" JOBS=3 scripts/build-ios-deps.sh

      - name: Save successfully built dependencies before emulator compilation
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: prefix
          key: iosdeps-${{ runner.os }}-${{ steps.env.outputs.xcode }}-${{ steps.env.outputs.deps }}

      - name: Build the required iPhone USB compression dependency
        run: PREFIX="$PREFIX" bash scripts/build-ios-lz4.sh

      - name: Clone the emulator fork
        run: |
          git init inferno-src
          git -C inferno-src remote add origin https://github.com/agent-ios-dev/Inferno.git
          git -C inferno-src fetch --depth 1 origin "$EMULATOR_REF"
          git -C inferno-src checkout --detach FETCH_HEAD

      - name: Meson cross-file
        run: PREFIX="$PREFIX" ./make-cross-file.sh

      - name: Fetch required guest filesystem patcher
        run: |
          git init tools/InfernoFSPatcher
          git -C tools/InfernoFSPatcher remote add origin https://git.chefkiss.dev/AppleHax/InfernoFSPatcher.git
          git -C tools/InfernoFSPatcher fetch --depth 1 origin 3008aaaa0909824a71ee3040c9edc58703c250f5
          git -C tools/InfernoFSPatcher checkout --detach FETCH_HEAD

      - name: Build libqemu-aarch64-softmmu.dylib
        run: |
          meson setup build/inferno inferno-src \
            --cross-file=cross-ios-arm64.txt \
            -Dbuildtype=release -Dprefix="$PREFIX" \
            -Dshared_lib=true -Db_staticpic=true -Dwerror=false \
            -Dkvm=disabled -Dhvf=disabled -Dwhpx=disabled \
            -Dcocoa=disabled -Dgtk=disabled -Dsdl=disabled -Dcurses=disabled \
            -Dcoreaudio=disabled -Dcurl=disabled -Dlibssh=disabled -Dbzip2=disabled \
            -Dvnc=enabled -Dvnc_jpeg=disabled -Dvnc_sasl=disabled \
            -Dtools=disabled -Dcoroutine_backend=ucontext
          ninja -C build/inferno libqemu-aarch64-softmmu.dylib

      - name: Build Inferno.ipa
        working-directory: app
        env:
          # build.sh probes actool itself and falls back to the flat
          # Assets.xcassets icon when Inferno.icon (Xcode 26+) isn't supported.
          INFERNO_KEYMAPS: /opt/homebrew/share/qemu/keymaps
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-ipa
          path: app/Inferno.ipa
          if-no-files-found: error
