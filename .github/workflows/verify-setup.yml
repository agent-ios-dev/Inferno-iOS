name: Verify automatic setup
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Probe actual Mac HVF VM and vCPU capability without running guest code
        run: |
          xcrun clang -target arm64-apple-macos15.0 -Wall -Wextra tests/automatic-setup/hvf-probe.c -framework Hypervisor -o /tmp/inferno-hvf-probe
          codesign -f -s - --entitlements app/Resources/entitlements-macos.plist /tmp/inferno-hvf-probe
          if /tmp/inferno-hvf-probe > host-hvf-probe.json; then
            python3 -c 'import json; print(json.load(open("host-hvf-probe.json")))'
          else
            probe_exit=$?
            echo "{\"available\":false,\"probe_exit\":$probe_exit}" > host-hvf-probe.json
            cat host-hvf-probe.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: host-hvf-capability
          path: host-hvf-probe.json
      - name: Verify private VM transfer file selection and integrity checks
        run: |
          brew list qemu >/dev/null 2>&1 || brew install qemu
          python3 tests/automatic-setup/test_vm_bundle.py
          ruby -ryaml -e 'YAML.load_file("tools/private-delivery/capture.yml"); puts "Private workflow template YAML parsed"'
      - name: Verify real Swift download and firmware identity validation
        run: |
          swiftc app/Sources/AutomaticSetupProfile.swift tests/automatic-setup/main.swift -o /tmp/inferno-setup-tests
          /tmp/inferno-setup-tests
      - name: Verify bounded live guest process evidence parsing
        run: |
          swiftc tests/automatic-setup/BootProcessEvidence.swift tests/boot-process/main.swift -o /tmp/inferno-boot-process-tests
          /tmp/inferno-boot-process-tests
      - name: Verify actual USB transport with short descriptors and NAK
        run: |
          swiftc -D INFERNO_USB_TEST app/Sources/GuestUSB.swift tests/usb/main.swift -o /tmp/inferno-usb-tests
          /tmp/inferno-usb-tests
      - name: Verify actual backend DMA range handling
        run: |
          git init /tmp/inferno-range-core
          git -C /tmp/inferno-range-core remote add origin https://github.com/agent-ios-dev/Inferno.git
          git -C /tmp/inferno-range-core fetch --depth 1 origin d5dcc2f0a353f65d9be4ba7b4d4011887f4c2f67
          git -C /tmp/inferno-range-core checkout --detach FETCH_HEAD
          python3 tests/usb/dwc3-range.py /tmp/inferno-range-core/hw/usb/hcd-dwc3.c
          python3 tests/usb/dart-invalidation.py /tmp/inferno-range-core/hw/arm/dart.c
      - name: Typecheck iOS and macOS shared sources
        run: |
          echo 'enum BuildInfo { static let stamp = "CI typecheck" }' > /tmp/InfernoBuildInfo.swift
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios16.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -parse-as-library /tmp/InfernoBuildInfo.swift app/Sources/*.swift
          xcrun --sdk macosx swiftc -typecheck -target arm64-apple-macos15.0 -sdk "$(xcrun --sdk macosx --show-sdk-path)" -parse-as-library /tmp/InfernoBuildInfo.swift app/Sources/*.swift
          xcrun --sdk macosx swiftc -D INFERNO_RESTORE_SMOKE -typecheck -target arm64-apple-macos15.0 -sdk "$(xcrun --sdk macosx --show-sdk-path)" -parse-as-library /tmp/InfernoBuildInfo.swift app/Sources/*.swift tests/automatic-setup/BootProcessEvidence.swift tests/automatic-setup/RestoreSmoke.swift
      - name: Check restore daemon builds for the guest
        run: |
          xcrun --sdk iphoneos clang -fsyntax-only -target arm64-apple-ios14.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" app/guest/patcher-daemon.c
